# go2_guardian: el unico que le habla al perro. Limites DUROS (el planificador de CMU ya va por
# debajo: maxSpeed en 'go2v2 lanzar velocidad:=...')
go2_guardian:
  ros__parameters:
    vx_max: 1.0                 # m/s adelante/atras
    vy_max: 0.6                 # m/s de lado (el perro esquiva en diagonal)
    wz_max: 1.5                 # rad/s de giro
    vigencia: 0.25              # s: si el planificador no manda nada en este tiempo -> StopMove
    freewalk: true              # al levantarse/desbloquear: marcha FreeWalk (firmware >= 1.1.7)
    v_min_caminar: 0.0          # 0 = no tocar. (0.2 si el perro "pisa en el sitio" a poca velocidad)
    apagar_evitacion_unitree: true
